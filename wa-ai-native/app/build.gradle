plugins {
    id 'com.android.application'
}

android {
    namespace 'id.bnnk.waai'
    compileSdk 35

    defaultConfig {
        applicationId 'id.bnnk.waai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
