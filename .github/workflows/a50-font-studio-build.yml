name: Build A50 Font Studio APK

on:
  push:
    branches: [ "codex/a50-font-studio" ]
    paths:
      - "A50-Font-Studio/**"
      - ".github/workflows/a50-font-studio-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-a50-font-studio:
    name: Buat APK A50 Font Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: A50-Font-Studio

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Beri nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A50-Font-Studio.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: A50-Font-Studio-APK
          path: A50-Font-Studio/A50-Font-Studio.apk
          if-no-files-found: error
          retention-days: 30
