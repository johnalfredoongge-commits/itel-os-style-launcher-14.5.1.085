name: Build APK Otomatis

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Buat APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Beri nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A50-Font-Studio.apk

      - name: Simpan APK untuk di-download
        uses: actions/upload-artifact@v4
        with:
          name: A50-Font-Studio-APK
          path: A50-Font-Studio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release saat tag v* dikirim
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: A50-Font-Studio.apk
          generate_release_notes: true
